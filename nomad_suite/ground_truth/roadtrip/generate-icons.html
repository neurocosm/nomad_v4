<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOMAD - PWA Icon Generator</title>
  <style>
    body {
      background: #0b0c10;
      color: #e0e6ed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px;
      margin: 0;
    }
    h1 { margin-bottom: 6px; color: #ffffff; }
    p { color: #8b949e; margin-bottom: 24px; text-align: center; max-width: 480px; }
    canvas {
      border-radius: 24px;
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.25);
      margin-bottom: 24px;
      background: #000000;
    }
    .btn {
      background: #00d4ff;
      color: #000000;
      font-weight: 900;
      font-size: 1rem;
      border: none;
      padding: 14px 28px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(0, 212, 255, 0.6);
      transition: transform 0.1s ease;
    }
    .btn:active { transform: scale(0.95); }
    .status { margin-top: 14px; font-size: 0.85rem; color: #4cd964; font-weight: 700; }
  </style>
</head>
<body>

  <h1>NOMAD Icon Engine</h1>
  <p>Renders high-res, safe-zone compliant PWA & iOS icons with neon telemetry styling. Zero corner clipping on any mobile launcher or splash screen.</p>

  <div style="display: flex; gap: 8px; margin-bottom: 16px;">
    <button class="btn" style="padding: 6px 14px; font-size: 0.85rem;" onclick="setMask('none')">Full Canvas</button>
    <button class="btn" style="padding: 6px 14px; font-size: 0.85rem;" onclick="setMask('squircle')">iOS / OneUI Squircle</button>
    <button class="btn" style="padding: 6px 14px; font-size: 0.85rem;" onclick="setMask('circle')">Android Circle Mask</button>
  </div>

  <canvas id="preview" width="300" height="300"></canvas>
  <button class="btn" onclick="generateAndDownloadAll()">Download All 7 PWA & iOS Icons</button>
  <div class="status" id="status"></div>

  <script>
    const SIZES = [
      { name: 'icon-192.png', size: 192, maskable: false },
      { name: 'icon-512.png', size: 512, maskable: false },
      { name: 'icon-maskable-192.png', size: 192, maskable: true },
      { name: 'icon-maskable-512.png', size: 512, maskable: true },
      { name: 'apple-touch-icon.png', size: 180, maskable: false },
      { name: 'nomad_icon_192x192.png', size: 192, maskable: false },
      { name: 'nomad_icon_512x512.png', size: 512, maskable: false }
    ];

    let currentMask = 'none';

    function setMask(mask) {
      currentMask = mask;
      renderPreview();
    }

    function drawNomadIcon(ctx, size) {
      const c = size / 2;
      
      // 1. Solid Obsidian Black Background
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, size, size);

      // 2. Concentric Neon Radar Telemetry Rings (Anchored at c, c - size * 0.065)
      const centerY = c - size * 0.065;

      ctx.strokeStyle = 'rgba(0, 212, 255, 0.22)';
      ctx.lineWidth = size * 0.005;
      ctx.setLineDash([size * 0.02, size * 0.015]);
      ctx.beginPath();
      ctx.arc(c, centerY, size * 0.31, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.strokeStyle = 'rgba(0, 212, 255, 0.38)';
      ctx.lineWidth = size * 0.006;
      ctx.beginPath();
      ctx.arc(c, centerY, size * 0.21, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(0, 212, 255, 0.18)';
      ctx.lineWidth = size * 0.0035;
      ctx.beginPath();
      ctx.arc(c, centerY, size * 0.105, 0, Math.PI * 2);
      ctx.stroke();

      // Crosshair ticks
      ctx.strokeStyle = 'rgba(0, 212, 255, 0.5)';
      ctx.lineWidth = size * 0.005;
      ctx.beginPath();
      ctx.moveTo(c, centerY - size * 0.33);
      ctx.lineTo(c, centerY - size * 0.30);
      ctx.moveTo(c - size * 0.33, centerY);
      ctx.lineTo(c - size * 0.30, centerY);
      ctx.moveTo(c + size * 0.30, centerY);
      ctx.lineTo(c + size * 0.33, centerY);
      ctx.stroke();

      // 3. Dynamic Forward Chevron (Rotated -45 deg)
      ctx.save();
      ctx.translate(c, centerY);
      ctx.rotate(-Math.PI / 4);

      const s = size * 0.38;

      ctx.shadowColor = '#00d4ff';
      ctx.shadowBlur = size * 0.04;

      // Left Wing (Cyan)
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.52);
      ctx.lineTo(-s * 0.36, s * 0.41);
      ctx.lineTo(0, s * 0.16);
      ctx.closePath();
      const cyanGrad = ctx.createLinearGradient(0, -s * 0.5, 0, s * 0.4);
      cyanGrad.addColorStop(0, '#38bdf8');
      cyanGrad.addColorStop(1, '#00d4ff');
      ctx.fillStyle = cyanGrad;
      ctx.fill();

      // Right Wing (Racing Orange)
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.52);
      ctx.lineTo(s * 0.36, s * 0.41);
      ctx.lineTo(0, s * 0.16);
      ctx.closePath();
      const orangeGrad = ctx.createLinearGradient(0, -s * 0.5, 0, s * 0.4);
      orangeGrad.addColorStop(0, '#ff7b00');
      orangeGrad.addColorStop(1, '#ff3b00');
      ctx.fillStyle = orangeGrad;
      ctx.fill();

      // Spine Center Divider (Pure White)
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = size * 0.007;
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.52);
      ctx.lineTo(0, s * 0.16);
      ctx.stroke();

      ctx.restore();

      // 4. "NOMAD" High-Contrast Typography (Safe-Zone Bounded)
      const textY = size * 0.722;
      ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
      ctx.shadowBlur = size * 0.03;
      ctx.font = `900 ${Math.floor(size * 0.086)}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';
      ctx.letterSpacing = `${size * 0.01}px`;
      ctx.fillText('NOMAD', c, textY);

      // HUD Green Accents on typography sides (snug to text, well inside safe circle)
      ctx.fillStyle = '#4cd964';
      const pillW = size * 0.032;
      const pillH = size * 0.016;
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(c - size * 0.24, textY - pillH / 2, pillW, pillH, pillH / 2);
        ctx.roundRect(c + size * 0.24 - pillW, textY - pillH / 2, pillW, pillH, pillH / 2);
        ctx.fill();
      } else {
        ctx.fillRect(c - size * 0.24, textY - pillH / 2, pillW, pillH);
        ctx.fillRect(c + size * 0.24 - pillW, textY - pillH / 2, pillW, pillH);
      }
    }

    function renderPreview() {
      const prevCanvas = document.getElementById('preview');
      const ctx = prevCanvas.getContext('2d');
      ctx.clearRect(0, 0, 300, 300);

      // If mask active, clip before drawing
      ctx.save();
      if (currentMask === 'circle') {
        ctx.beginPath();
        ctx.arc(150, 150, 120, 0, Math.PI * 2);
        ctx.clip();
      } else if (currentMask === 'squircle') {
        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(30, 30, 240, 240, 52);
        } else {
          ctx.arc(150, 150, 120, 0, Math.PI * 2);
        }
        ctx.clip();
      }

      drawNomadIcon(ctx, 300);
      ctx.restore();

      // Show safe zone guideline if on full canvas
      if (currentMask === 'none') {
        ctx.save();
        ctx.strokeStyle = 'rgba(76, 217, 100, 0.45)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.arc(150, 150, 120, 0, Math.PI * 2); // 80% diameter safe zone
        ctx.stroke();
        ctx.restore();
      }
    }

    renderPreview();

    function downloadCanvas(canvas, filename) {
      const a = document.createElement('a');
      a.download = filename;
      a.href = canvas.toDataURL('image/png');
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function generateAndDownloadAll() {
      const status = document.getElementById('status');
      status.innerText = 'Exporting icons...';

      SIZES.forEach((item, index) => {
        setTimeout(() => {
          const offscreen = document.createElement('canvas');
          offscreen.width = item.size;
          offscreen.height = item.size;
          const ctx = offscreen.getContext('2d');
          drawNomadIcon(ctx, item.size);
          downloadCanvas(offscreen, item.name);

          if (index === SIZES.length - 1) {
            status.innerText = '✅ All 5 icons downloaded! Place them inside the /icons folder.';
          }
        }, index * 250);
      });
    }
  </script>
</body>
</html>
