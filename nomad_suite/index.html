<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>NOMAD: SUITE — Multi-Cockpit Navigation</title>
  <meta name="description" content="NOMAD: SUITE - Unified RoadTrip, Hyperspace & DIGIT by BostonyFX (@neurocosm)" />
  <meta name="theme-color" content="#050811" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #050811;
      color: #f8fafc;
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }
    .hud-card {
      background: #0b1325;
      border: 1.5px solid rgba(0, 243, 255, 0.35);
      border-radius: 20px;
      max-width: 440px;
      width: 100%;
      padding: 28px 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7), 0 0 24px rgba(0, 243, 255, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .brand-badge {
      font-size: 0.76rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #00f3ff;
      background: rgba(0, 243, 255, 0.12);
      border: 1px solid rgba(0, 243, 255, 0.4);
      padding: 4px 12px;
      border-radius: 14px;
    }
    h1 {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #ffffff;
    }
    p.tagline {
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.45;
    }
    .truth-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      margin: 8px 0;
    }
    .truth-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(0, 243, 255, 0.2);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.85rem;
      font-family: 'JetBrains Mono', monospace;
      color: #f8fafc;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .truth-item:hover, .truth-item:active {
      background: rgba(0, 243, 255, 0.12);
      border-color: #00f3ff;
      transform: translateY(-1px);
    }
    .truth-item span.ready {
      color: #10b981;
      font-weight: 700;
      font-size: 0.72rem;
    }
    .status-box {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      color: #10b981;
      width: 100%;
    }
    footer {
      font-size: 0.68rem;
      font-family: 'JetBrains Mono', monospace;
      color: #475569;
      margin-top: 8px;
    }
    footer a {
      color: #00f3ff;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="hud-card">
    <div class="brand-badge">NOMAD: SUITE // DEV HUB</div>
    <h1>NOMAD SUITE</h1>
    <p class="tagline">Unified Multi-Cockpit Navigation Architecture<br/>RoadTrip • Hyperspace • DIGIT</p>

    <div class="truth-grid">
      <a href="./ground_truth/roadtrip/" class="truth-item">
        <span>🚗 RoadTrip (v3)</span>
        <span class="ready">LAUNCH BENCHMARK ↗</span>
      </a>
      <a href="./ground_truth/hyperspace/" class="truth-item">
        <span>🚀 Hyperspace (v4)</span>
        <span class="ready">LAUNCH BENCHMARK ↗</span>
      </a>
      <a href="./ground_truth/digit/" class="truth-item">
        <span>📟 DIGIT (Text-Only)</span>
        <span class="ready">LAUNCH BENCHMARK ↗</span>
      </a>
    </div>

    <div class="status-box">
      STANDBY // Awaiting Phase 1 Discussion &amp; Approval
    </div>

    <footer>
      Crafted by <a href="https://www.instagram.com/neurocosm" target="_blank">BostonyFX</a>
    </footer>
  </div>

</body>
</html>
